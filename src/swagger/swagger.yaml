openapi: 3.0.0
info:
  title: Autonomous Drone Navigation API
  description: |
    API для управления автономным дроном в условиях отсутствия GPS/ГЛОНАСС.
    Предоставляет методы для навигации, управления миссиями и получения данных с бортовых сенсоров.
  version: 1.0.0
servers:
  - url: http://drone-api.local/v1
    description: Основной сервер API
paths:
  /webrtc:
    post:
      summary: Установка WebRTC-соединения
      description: |
        Инициирует WebRTC-соединение для передачи видеопотока и управления дроном
        в реальном времени через локальную сеть.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sdp_offer:
                  type: string
                  description: SDP-предложение от клиента
                client_id:
                  type: string
                  description: Уникальный идентификатор клиента
              required: [sdp_offer, client_id]
      responses:
        '200':
          description: SDP-ответ для установки соединения
          content:
            application/json:
              schema:
                type: object
                properties:
                  sdp_answer:
                    type: string
                    description: SDP-ответ от сервера
        '400':
          $ref: '#/components/responses/BadRequest'

  /arm:
    post:
      summary: Активация двигателей
      description: Активирует силовые установки дрона для подготовки к полету
      responses:
        '200':
          description: Двигатели успешно активированы
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: armed
        '400':
          $ref: '#/components/responses/BadRequest'

  /disarm:
    post:
      summary: Деактивация двигателей
      description: Отключает двигатели дрона после завершения полета
      responses:
        '200':
          description: Двигатели успешно деактивированы
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: disarmed
        '400':
          $ref: '#/components/responses/BadRequest'

  /takeoff:
    post:
      summary: Взлет
      description: Начинает автономный взлет на заданную высоту
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                altitude:
                  type: number
                  format: float
                  description: Целевая высота в метрах
                  example: 15.5
              required: [altitude]
      responses:
        '200':
          description: Взлет успешно инициирован
          content:
            application/json:
              schema:
                type: object
                properties:
                  target_altitude:
                    type: number
                    example: 15.5
                  status:
                    type: string
                    example: taking_off
        '400':
          $ref: '#/components/responses/BadRequest'

  /land:
    post:
      summary: Посадка
      description: Инициирует автономную посадку в текущей позиции
      responses:
        '200':
          description: Посадка успешно начата
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: landing
        '400':
          $ref: '#/components/responses/BadRequest'

  /goto:
    post:
      summary: Перемещение к точке
      description: |
        Перемещает дрон к указанным координатам с использованием оптического потока
        и данных дальномера при отсутствии спутниковой навигации
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                latitude:
                  type: number
                  format: float
                  description: Широта в градусах
                  example: 55.75222
                longitude:
                  type: number
                  format: float
                  description: Долгота в градусах
                  example: 37.61556
                altitude:
                  type: number
                  format: float
                  description: Высота над уровнем земли (м)
                  example: 10.0
              required: [latitude, longitude, altitude]
      responses:
        '200':
          description: Перемещение запланировано
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: en_route
        '400':
          $ref: '#/components/responses/BadRequest'

  /mission/save:
    post:
      summary: Сохранение миссии
      description: Сохраняет миссию с последовательностью точек и действиями
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Mission'
      responses:
        '201':
          description: Миссия успешно сохранена
          content:
            application/json:
              schema:
                type: object
                properties:
                  mission_id:
                    type: string
                    example: mission_2025_001
        '400':
          $ref: '#/components/responses/BadRequest'

  /mission/{mission_id}:
    get:
      summary: Получение миссии
      description: Возвращает данные сохраненной миссии по ID
      parameters:
        - name: mission_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Данные миссии
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '404':
          description: Миссия не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          $ref: '#/components/responses/BadRequest'

  /map:
    get:
      summary: Получение карты окружения
      description: |
        Возвращает карту местности, сгенерированную на основе данных с камеры
        и дальномера в формате PNG
      responses:
        '200':
          description: Изображение карты
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: Карта недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /telemetry:
    get:
      summary: Получение телеметрии
      description: Текущие параметры полета (координаты, высота, скорость)
      responses:
        '200':
          description: Данные телеметрии
          content:
            application/json:
              schema:
                type: object
                properties:
                  position:
                    type: object
                    properties:
                      x:
                        type: number
                        description: Локальная координата X (м)
                      y:
                        type: number
                        description: Локальная координата Y (м)
                      z:
                        type: number
                        description: Высота (м)
                  velocity:
                    type: number
                    description: Скорость (м/с)
                  battery:
                    type: number
                    description: Уровень заряда (%)
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  schemas:
    Mission:
      type: object
      required: [mission_id, waypoints]
      properties:
        mission_id:
          type: string
          description: Уникальный идентификатор миссии
        waypoints:
          type: array
          items:
            type: object
            properties:
              latitude:
                type: number
                format: float
              longitude:
                type: number
                format: float
              altitude:
                type: number
                format: float
              action:
                type: string
                enum: [hover, capture_image, follow_target]
                description: Действие в точке маршрута
        scenario:
          type: string
          enum: [flashlight, escort, recon]
          description: Тип сценария выполнения миссии

    Error:
      type: object
      properties:
        code:
          type: integer
          example: 404
        message:
          type: string
          example: Mission not found

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'